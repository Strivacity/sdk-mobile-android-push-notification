name: Tests

on:
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest koverXmlReport koverVerify --no-daemon

      - name: Compile instrumented tests
        run: ./gradlew compileDebugAndroidTestSources --no-daemon

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: pushnotification/build/reports/tests/testDebugUnitTest

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: pushnotification/build/reports/kover

  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      # Keeps the Android SDK (emulator, system images) and the JDK toolcache. `large-packages` is
      # disabled because it removes libgl1-mesa-dri, which the software-rendered emulator may need.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: false
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          preinstalled-runtimes: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: "21"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: |
          # GitHub's default shell uses pipefail; `yes` exits with SIGPIPE once sdkmanager is done
          # reading, which would otherwise fail this step.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Cache AVD image
        uses: actions/cache@v4
        with:
          path: ~/.android/avd/*
          key: avd-ciDevice-api30-v2-${{ hashFiles('pushnotification/build.gradle.kts') }}

      # The runner has no GPU or display, and the emulator rejects Gradle's default GPU mode
      # (`auto-no-window`), so the mode is set explicitly to a software renderer.
      - name: Run instrumented tests on Gradle Managed Device
        run: >-
          ./gradlew :pushnotification:ciDeviceDebugAndroidTest --no-daemon --info
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: pushnotification/build/reports/androidTests/managedDevice
