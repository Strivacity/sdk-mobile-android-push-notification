name: Spotless

on:
  pull_request:
    branches:
      - main

jobs:
  spotless-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Spotless check
        run: ./gradlew spotlessCheck --no-daemon
